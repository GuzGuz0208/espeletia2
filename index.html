<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fray · guía del páramo</title>
  <meta name="description" content="Asistente de las estaciones del sector norte del PNN Los Nevados. Funciona sin internet y responde con los guiones oficiales.">
  <meta name="theme-color" content="#2f6b4f">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Barra superior: estado y ajustes -->
  <header class="barra">
    <button class="btn-icono" id="btn-volver" hidden aria-label="Estaciones"></button>
    <p class="barra-titulo" id="barra-titulo"></p>
    <span class="insignia" id="insignia-ejemplo" hidden></span>
    <button class="btn-icono" id="btn-ajustes" aria-label="Ajustes"></button>
  </header>

  <main>
    <!-- 1. Inicio: elegir estación -->
    <section class="vista" id="vista-inicio">
      <div class="saludo">
        <div class="fray" id="fray-inicio"></div>
        <div>
          <h1 data-t="app.titulo"></h1>
          <p class="sub" data-t="app.sub"></p>
        </div>
      </div>
      <p class="estado" id="estado-carga" data-t="estado.preparando"></p>
      <button class="btn btn-flor btn-grande btn-ancho" id="btn-qr"><span class="ico" id="ico-qr"></span><span data-t="inicio.qr"></span></button>
      <h2 class="titulo-seccion" data-t="inicio.elige"></h2>
      <ol class="estaciones" id="lista-estaciones"></ol>
      <p class="nota-guia" data-t="inicio.guia"></p>
      <p class="pie"><a href="panel.html" data-t="pie.panel"></a></p>
    </section>

    <!-- 2. Escanear QR de estación -->
    <section class="vista" id="vista-qr" hidden>
      <h2 class="titulo-seccion" data-t="qr.titulo"></h2>
      <div class="camara"><video id="video" playsinline muted></video><div class="mira"></div></div>
      <p class="mensaje" id="qr-mensaje" role="status"></p>
      <button class="btn btn-linea btn-grande btn-ancho" id="btn-qr-cancelar" data-t="qr.cancelar"></button>
    </section>

    <!-- 3. Chat de la estación -->
    <section class="vista vista-chat" id="vista-chat" hidden>
      <div class="cab-estacion">
        <div class="fray fray-mini" id="fray-chat"></div>
        <div>
          <h1 id="chat-estacion"></h1>
          <p class="altitud" id="chat-altitud"></p>
        </div>
      </div>
      <div class="avisos" id="avisos" role="status" hidden></div>
      <p class="burbuja-fray" id="chat-hola"></p>
      <div class="sugerencias" id="sugerencias">
        <p class="etiqueta-sug" data-t="chat.sugerencias"></p>
        <div class="chips" id="chips-sug"></div>
      </div>
      <div class="conversacion" id="conversacion" aria-live="polite"></div>
    </section>
  </main>

  <!-- Caja de pregunta (solo en el chat) -->
  <form class="caja-pregunta" id="form-pregunta" hidden>
    <label class="oculto" for="pregunta" data-t="chat.placeholder"></label>
    <textarea id="pregunta" rows="2" maxlength="300" data-t-ph="chat.placeholder" enterkeyhint="send"></textarea>
    <button class="btn btn-flor btn-enviar" type="submit"><span class="ico" id="ico-enviar"></span><span data-t="chat.preguntar"></span></button>
  </form>

  <!-- Ajustes: letra, contraste, idioma -->
  <dialog id="dlg-ajustes" class="dialogo">
    <h2 data-t="ajustes.titulo"></h2>
    <fieldset>
      <legend data-t="ajustes.letra"></legend>
      <div class="segmentado" id="opc-letra">
        <button type="button" data-letra="1" aria-label="A normal">A</button>
        <button type="button" data-letra="2" aria-label="A grande">A+</button>
        <button type="button" data-letra="3" aria-label="A muy grande">A++</button>
      </div>
    </fieldset>
    <label class="interruptor"><input type="checkbox" id="opc-contraste"> <span data-t="ajustes.contraste"></span></label>
    <fieldset>
      <legend data-t="ajustes.idioma"></legend>
      <div class="segmentado" id="opc-idioma">
        <button type="button" data-idioma="es">Español</button>
        <button type="button" data-idioma="en">English</button>
      </div>
    </fieldset>
    <form method="dialog"><button class="btn btn-flor btn-ancho" data-t="ajustes.cerrar"></button></form>
  </dialog>

  <script src="lib/jsQR.js" defer></script>
  <script type="module" src="js/ui.js"></script>
  <!-- Cromos y sobres (rama eduardo/cromos, spec docs/specs/cromos.md). Escucha el evento 'fray:cromo' que dispara js/ui.js.
       Para activarlo, quita el comentario:
  <script type="module" src="js/cromos.js"></script>
  -->
</body>
</html>
